<title>코리아식품 수율 일지</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: 현장 클립보드 — 위쪽 단계 탭, 큰 입력칸, 입력된 숫자는 볼펜 파랑. 일지는 A4 종이 그대로. */
:root{
  --bg:#eef1f4; --card:#ffffff; --ink:#1b2026; --muted:#5b6571; --line:#d3d9e0; --soft:#f5f7f9;
  --pen:#2340a8; --pen-soft:#e7ecfb; --ok:#1d7a4b; --ok-soft:#e3f3ea; --warn:#9a5c00; --warn-soft:#fbf0dc; --bad:#b3261e; --bad-soft:#fbe5e3; --loss:#d4602a; --gain:#1d9a6c;
  --doc-bg:#ffffff; --doc-ink:#111111; --doc-line:#222222; --doc-head:#ececec;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101317; --card:#181d23; --ink:#e6eaee; --muted:#9aa4af; --line:#2b323a; --soft:#1e242b;
  --pen:#93a9ff; --pen-soft:#1e2847; --ok:#5cc690; --ok-soft:#16301f; --warn:#e6a845; --warn-soft:#33270f; --bad:#f2786e; --bad-soft:#3a1b19; --loss:#e07a48; --gain:#3dba8a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101317; --card:#181d23; --ink:#e6eaee; --muted:#9aa4af; --line:#2b323a; --soft:#1e242b;
  --pen:#93a9ff; --pen-soft:#1e2847; --ok:#5cc690; --ok-soft:#16301f; --warn:#e6a845; --warn-soft:#33270f; --bad:#f2786e; --bad-soft:#3a1b19; --loss:#e07a48; --gain:#3dba8a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand .sub{color:var(--muted);font-size:13px}
.sync{margin-left:auto;font-size:12px;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.sync.shared{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.sync.local{color:var(--warn);background:var(--warn-soft);border-color:transparent}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;border:0;background:none;font:inherit;font-size:14px;color:var(--muted);padding:9px 12px 11px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button .n{font-family:var(--f-num);font-size:12px;display:inline-grid;place-items:center;width:19px;height:19px;border-radius:50%;border:1.5px solid currentColor;margin-right:5px}
nav.tabs button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--pen)}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
main{padding-top:18px;display:grid;gap:18px}
h2{font-size:19px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:15px;margin:0 0 10px}
.lead{color:var(--muted);margin:4px 0 0;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid2{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:18px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.fields .wide{grid-column:1/-1}
label.f,div.f{display:grid;gap:4px;font-size:13px;color:var(--muted);min-width:0}
label.f b,div.f>b{color:var(--ink);font-weight:600}
[hidden]{display:none!important}
.addrow{margin-top:6px;padding:10px;border:1px dashed var(--pen);border-radius:8px;background:var(--pen-soft);display:grid;gap:6px}
.addrow .fields{gap:8px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 11px;width:100%;min-width:0}
input.num{font-family:var(--f-num);font-size:17px;color:var(--pen);font-weight:500}
input.big{font-size:22px;padding:12px}
.unit{position:relative}
.unit input{padding-right:40px}
.unit span{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none}
.btn{font:inherit;font-weight:600;border-radius:8px;padding:10px 16px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--pen);border-color:var(--pen);color:var(--card)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:5px 10px;font-size:13px;font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip.s1{background:var(--warn-soft);color:var(--warn)}
.chip.s2{background:var(--pen-soft);color:var(--pen)}
.chip.s3{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.lotlist{display:grid;gap:8px}
.lot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;width:100%}
.lot:hover{border-color:var(--muted)}
.lot[aria-pressed="true"]{border-color:var(--pen);box-shadow:inset 0 0 0 1px var(--pen);background:var(--pen-soft)}
.lot .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.lot .m{grid-column:1/-1;color:var(--muted);font-size:13px;font-family:var(--f-num)}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--soft);border-radius:8px;padding:10px 12px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--f-num);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--pen)}
.kpi .d{font-size:12px;color:var(--muted)}
.kpi.warn{background:var(--warn-soft)} .kpi.warn .v{color:var(--warn)}
.kpi.bad{background:var(--bad-soft)} .kpi.bad .v{color:var(--bad)}
.kpi.ok .v{color:var(--ok)}
.formula{font-size:12px;color:var(--muted);font-family:var(--f-num)}
.warns{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.warns li{font-size:13px;padding:7px 10px;border-radius:7px;background:var(--warn-soft);color:var(--warn)}
.warns li.bad{background:var(--bad-soft);color:var(--bad)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.t{border-collapse:collapse;width:100%;font-size:13px;min-width:720px}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.t th{background:var(--soft);font-weight:600;color:var(--muted);font-size:12px}
table.t td.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
table.t tr:last-child td{border-bottom:0}
.pen{color:var(--pen)}
.muted{color:var(--muted)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
.banner{padding:10px 14px;border-radius:8px;font-size:13px;background:var(--warn-soft);color:var(--warn)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;border:0;background:var(--card);color:var(--muted);padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pen);color:var(--card);font-weight:600}
.packrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.packrow .m{font-family:var(--f-num);font-size:13px;color:var(--muted)}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:13px}
.spark{display:block}
/* 관리자 */
.kpi.hero{background:var(--pen-soft)}
.apill{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--soft);color:var(--muted)}
.apill.good{background:var(--ok-soft);color:var(--ok)}.apill.warn{background:var(--warn-soft);color:var(--warn)}.apill.crit{background:var(--bad-soft);color:var(--bad)}
.grid2.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:860px){.grid2.even{grid-template-columns:minmax(0,1fr)}}
.rk-axis,.rk{display:grid;grid-template-columns:minmax(0,190px) minmax(100px,1fr) 76px minmax(0,130px);gap:12px;align-items:center}
.rk-axis{font-size:11px;color:var(--muted);padding:0 6px 6px}.rk-axis .ax{display:flex;justify-content:space-between}
.rk{padding:9px 6px;border:0;border-top:1px solid var(--line);background:none;font:inherit;color:inherit;text-align:left;width:100%}
button.rk{cursor:pointer}button.rk:hover{background:var(--soft)}
.rk-n{font-weight:600;font-size:14px;min-width:0;overflow-wrap:anywhere}.rk-n small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.rk-t{position:relative;height:16px}.rk-t .z{position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--muted)}
.rk-t .b{position:absolute;top:2px;height:12px;border-radius:3px;background:var(--pen)}.rk-t .b.warn{background:var(--warn)}.rk-t .b.crit{background:var(--bad)}.rk-t .b.run{background:var(--line)}
.rk-v{font-family:var(--f-num);font-weight:600;text-align:right;white-space:nowrap}.rk-v.warn{color:var(--warn)}.rk-v.crit{color:var(--bad)}.rk-v.run{color:var(--muted)}
.rk-m{font-size:12.5px;color:var(--muted);min-width:0}.rk-m b{color:var(--ink)}
@media (max-width:640px){.rk,.rk-axis{grid-template-columns:minmax(0,1fr) 76px;row-gap:6px}.rk-axis{display:none}.rk-t{grid-column:1/-1;order:3}.rk-m{grid-column:1/-1;order:4}}
.alerts{display:grid;gap:8px}
.alert{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border-radius:8px;background:var(--soft);border:0;font:inherit;color:inherit;text-align:left;width:100%}
button.alert{cursor:pointer}button.alert:hover{box-shadow:inset 0 0 0 1px var(--line)}
.alert .ic{width:12px;height:12px;border-radius:3px;background:var(--pen)}.alert .ic.warn{background:var(--warn);border-radius:0;clip-path:polygon(50% 0,100% 100%,0 100%)}.alert .ic.crit{background:var(--bad)}.alert .ic.good{background:var(--ok);border-radius:50%}
.alert .tx small{display:block;color:var(--muted);font-size:12.5px}.alert .go{font-size:13px;color:var(--pen);font-weight:600;white-space:nowrap}
@media (max-width:640px){.alert{grid-template-columns:auto minmax(0,1fr)}.alert .go{display:none}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.linkbtn{border:0;background:none;padding:0;font:inherit;font-size:12px;color:var(--pen);text-decoration:underline;cursor:pointer}
table.t tr.click{cursor:pointer}table.t tr.click:hover{background:var(--soft)}table.t tr.sel{background:var(--pen-soft)}table.t td small{display:block;color:var(--muted);font-size:11.5px}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:1000px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}@media (max-width:560px){.board{grid-template-columns:minmax(0,1fr)}}
.lane{display:grid;gap:8px}.lane-h{font-weight:600;padding-bottom:6px;border-bottom:2px solid var(--ink)}.lane-h b{font-family:var(--f-num);color:var(--pen);margin-left:4px}
.bcard{display:grid;gap:4px;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;width:100%}
.bcard.good{border-top-color:var(--ok)}.bcard.warn{border-top-color:var(--warn)}.bcard.crit{border-top-color:var(--bad)}.bcard.run{border-top-color:var(--pen)}
.bcard .bt{font-weight:600}.bcard .chip{justify-self:start}
nav.tabs button.admin-tab{color:var(--pen)}
td.chip-bad{color:var(--bad);font-weight:600} td.chip-warn{color:var(--warn);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--card);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
/* ── 종이 일지 (양쪽 테마에서 흰 종이) ── */
.paper-wrap{overflow-x:auto;background:var(--soft);border-radius:8px;padding:16px}
.paper{background:var(--doc-bg);color:var(--doc-ink);width:794px;min-height:1000px;margin:0 auto;padding:40px 44px;font-family:var(--f-ui);font-size:11.5px;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.paper table{border-collapse:collapse;width:100%;margin-bottom:16px}
.paper th,.paper td{border:1px solid var(--doc-line);padding:4px 6px;text-align:center;height:24px;font-weight:400}
.paper th{background:var(--doc-head);font-weight:600}
.paper td.r{text-align:right;font-family:var(--f-num)}
.paper td.l{text-align:left}
.paper .hand{color:#1e3aa8;font-family:var(--f-num);font-weight:500}
.paper .ttl{font-size:26px;font-weight:700;letter-spacing:.2em;text-align:center}
.paper .rev{font-size:11px}
.paper .dline{text-align:right;margin:2px 0 4px;font-size:12px}
.paper .appr td,.paper .appr th{width:56px}
.paper .appr td{height:40px}
.paper .vert{writing-mode:vertical-rl;letter-spacing:.3em;font-weight:600}
/* 태블릿·폰 터치 */
@media (pointer:coarse){
  .btn{min-height:44px;padding:11px 18px}
  .btn.small{min-height:40px;padding:8px 14px;font-size:14px}
  nav.tabs button{padding:12px 14px 13px;font-size:15px}
  .seg button{min-height:44px;padding:10px 16px}
  input[type=checkbox]{width:22px!important;height:22px}
  .lot{padding:14px}
  input,select{min-height:46px}
}
@media (min-width:600px) and (max-width:1100px){
  .wrap{max-width:none}
  .fields{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
}
#homeBody{display:grid;gap:18px}
.paper-wrap{overflow:hidden}
.paper{transform-origin:top left}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{body.printing *{visibility:hidden!important}body.printing #paper,body.printing #paper *{visibility:visible!important}body.printing #paper{position:absolute;left:0;top:0;transform:none!important;box-shadow:none;width:auto;margin:0;padding:0}body.printing header.top{display:none}@page{size:A4;margin:10mm}}
.who{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-left:auto}
.who select{width:auto;min-height:0;padding:4px 8px;font-size:14px;max-width:150px}
.brand .sync{margin-left:0}
.who+.who{margin-left:0}
.whoadd{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap;margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--pen-soft)}
main>*,#homeBody>*,#adminBody>*,.grid2>*,.card{min-width:0}
select{max-width:100%}
.loginwrap{display:grid;place-items:center;padding-block:24px}
.brandmark{font-size:13px;font-weight:600;color:var(--pen);letter-spacing:.02em}
.login h2{margin:0;font-size:24px}
.login .lead{margin:0}
.fields.lf{grid-template-columns:1fr;text-align:left}
.fields.lf input{font-size:17px;padding:12px}
.loginbtn{width:100%;font-size:17px;padding:14px;min-height:50px}
.keep{gap:8px;font-size:14px;color:var(--muted);justify-content:flex-start}
.keep input{width:auto}
.login{width:100%;max-width:420px;display:grid;gap:12px;text-align:center}
.login.wide{max-width:780px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.namebtn{font:inherit;font-size:19px;font-weight:600;padding:20px 10px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);cursor:pointer;display:grid;gap:2px}
.namebtn small{font-size:12px;color:var(--pen);font-weight:500}
.namebtn:hover{border-color:var(--pen)}
.dots{display:flex;gap:16px;justify-content:center;margin:4px 0}
.dots span{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted)}
.dots span.on{background:var(--pen);border-color:var(--pen)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto;width:100%}
.pad button{font:inherit;font-size:26px;font-family:var(--f-num);padding:16px 0;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:60px}
.pad button:active{background:var(--pen-soft)}
.pad button:disabled{opacity:.4}
.pad button[data-act="pinDel"],.pad button[data-act="loginBack"]{font-size:15px;font-family:var(--f-ui);color:var(--muted)}
.loginerr{color:var(--bad);margin:0;font-size:14px;min-height:1.4em}
.userchip{font-size:13px;font-weight:600;color:var(--pen);background:var(--pen-soft);padding:4px 10px;border-radius:99px;white-space:nowrap}
#userBox{display:flex;gap:6px;align-items:center}
#userBox:empty{display:none}
#chkText{font-family:var(--f-num);font-size:13px;resize:vertical}
.ck{display:inline-grid;place-items:center;width:20px;height:20px;border:1.5px solid var(--muted);border-radius:5px;margin-right:8px;font-size:13px;color:var(--pen);vertical-align:-3px}
.lot[aria-pressed="true"] .ck{border-color:var(--pen);background:var(--card)}
@media (pointer:coarse){.who select{min-height:40px}}
</style>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>코리아식품 수율 일지</h1>
      <span class="sub" id="today"></span>
      <label class="who">사업장 <select id="siteSel" aria-label="사업장"></select></label>
      <label class="who">입력자 <select id="whoSel" aria-label="입력자"></select></label><span id="userBox"></span>
      <span class="sync" id="sync">연결 중…</span>
    </div>
    <div class="whoadd" id="whoAdd" hidden><span class="muted" style="font-size:13px">명단에 이름 추가</span><input id="whoNew" placeholder="이름" style="max-width:180px" enterkeyhint="done"><button type="button" class="btn small primary" data-act="addWho">추가</button><button type="button" class="btn small" data-act="cancelWho">취소</button></div>
    <nav class="tabs" role="tablist" id="tabs">
      <button data-tab="home" role="tab">현황</button>
      <button data-tab="release" role="tab"><span class="n">1</span>원료육 출고</button>
      <button data-tab="wash" role="tab"><span class="n">2</span>세척 중량</button>
      <button data-tab="heat" role="tab"><span class="n">3</span>가열</button>
      <button data-tab="pack" role="tab"><span class="n">4</span>포장 수량</button>
      <button data-tab="docs" role="tab">일지 출력</button>
      <button data-tab="settings" role="tab" data-admin hidden>기준·백업</button>

function homeBody(){

    <div class="kpi ${wn.length?"warn":"ok"}"><div class="l">확인 필요</div><div class="v">${wn.length}</div><div class="d">기준 ±${S.cfg.tol}%p 또는 입력 이상</div></div></div>`;
  const wl=wn.length?`<div class="card"><h3>확인이 필요한 입력</h3><ul class="warns">${wn.slice(0,12).map(w=>`<li class="${w.lv}"><b>${esc(w.l.bl)}</b> · ${esc(lotTitle(w.l))} — ${esc(w.t)}</li>`).join("")}</ul></div>`:"";
  const trend=prodArr().filter(p=>!UI.prodFilter||p.id===UI.prodFilter).map(p=>{

    return `<div class="kpi"><div class="l">${esc(p.name)}</div>${spark(xs.map(x=>x.c.washYield*100),p.stdWash,"세척")}${spark(xs.filter(x=>x.c.heatYield!=null).map(x=>x.c.heatYield*100),p.stdHeat,"가열")}${spark(xs.filter(x=>x.c.packYield!=null).map(x=>x.c.packYield*100),p.stdPack,"포장")}<div class="d">로트 ${xs.length}건 · 점선 = 기준</div></div>`}).join("");

  <div class="card"><h3>로트별 기록 (${C.length}건)</h3>${C.length?`<div class="tbl-wrap"><table class="t"><thead><tr><th>출고일</th><th>이력·B/L</th><th>제품</th><th>출고kg</th><th>해동kg</th><th>세척kg</th><th>세척</th><th>가열</th><th>포장수량</th><th>포장kg</th><th>포장</th><th>종합</th><th>상태</th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="empty">이 기간에 출고된 로트가 없습니다.</div>`}</div>`}
function spark(vals,std,label){
  if(!vals.length)return"";const W=220,H=44,all=[...vals,...(num(std)?[num(std)]:[])],mn=Math.min(...all)-3,mx=Math.max(...all)+3;
  const x=i=>vals.length===1?W/2:8+i*(W-16)/(vals.length-1),y=v=>H-4-(v-mn)/(mx-mn)*(H-10),last=vals[vals.length-1];
  return `<div class="row" style="gap:6px;flex-wrap:nowrap"><span class="formula" style="width:30px">${label}</span>
  <svg class="spark" viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" role="img" aria-label="${label} 수율 추이, 최근 ${last.toFixed(1)}%">
  ${num(std)?`<line x1="0" x2="${W}" y1="${y(num(std))}" y2="${y(num(std))}" stroke="var(--muted)" stroke-dasharray="3 3" stroke-width="1" vector-effect="non-scaling-stroke"/>`:""}
  <polyline points="${vals.map((v,i)=>x(i).toFixed(1)+","+y(v).toFixed(1)).join(" ")}" fill="none" stroke="var(--pen)" stroke-width="2" vector-effect="non-scaling-stroke"/>
  <line x1="${x(vals.length-1)}" x2="${x(vals.length-1)}" y1="${y(last)}" y2="${y(last)}" stroke="var(--pen)" stroke-width="8" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>
  <span class="formula pen" style="width:50px;text-align:right">${last.toFixed(1)}%</span></div>`}

   <label class="f"><b>입고일</b><input type="date" id="x_date" value="${esc(e?e.inDate:todayStr())}"></label>
   <label class="f"><b>사업장</b>${siteSelect("x_site",e?siteOf(e):"")}</label>
   <div class="f wide"><b>원료육 품명</b>${addSel("x_raw","raw",listOptions(rawNameList(),e?e.raw:"(돈막창)하이라이프"))}</div>
   <label class="f wide"><b>이력번호 · B/L번호</b><input id="x_bl" class="num" inputmode="numeric" value="${esc(e?e.bl:"")}" required></label>
   <div class="f"><b>원산지</b>${addSel("x_origin","origin",listOptions(originList(),e?e.origin:"캐나다산"))}</div>
   <label class="f"><b>소비기한</b><input type="date" id="x_exp" value="${esc(e?e.rawExpiry:"")}"></label>
   <label class="f"><b>입고 중량</b><span class="unit"><input id="x_kg" class="num big" inputmode="decimal" value="${esc(e?e.inKg:"")}" placeholder="0"><span>kg</span></span></label>
   <label class="f"><b>거래처</b><input id="x_sup" value="${esc(e?e.supplier||"":"")}"></label>
   <label class="f wide"><b>비고</b><input id="x_note" value="${esc(e?e.note||"":"")}"></label></div>
   <div class="row end" style="margin-top:14px">${e?`<button type="button" class="btn" data-act="cancelRaw">취소</button>`:""}<button class="btn primary" type="submit">${e?"수정 저장":"입고 등록"}</button></div></form>`}
function bindRaw(){const f=$("#rawForm");if(!f)return;f.addEventListener("submit",ev=>{ev.preventDefault();if(needWho())return;
  const kg=num($("#x_kg").value),bl=$("#x_bl").value.trim();if(!bl||!kg){toast("B/L번호와 입고 중량을 입력하세요");return}
  const old=UI.editRaw&&S.raws[UI.editRaw],r={...(old?clone(old):{createdAt:new Date().toISOString(),by:who()}),inDate:$("#x_date").value,site:$("#x_site").value,raw:$("#x_raw").value.trim(),bl,origin:$("#x_origin").value.trim(),rawExpiry:$("#x_exp").value,inKg:kg,supplier:$("#x_sup").value.trim(),note:$("#x_note").value.trim()};
  if(!old&&Object.values(S.raws).some(x=>!x.deleted&&x.bl===bl)){toast("이미 입고된 B/L입니다. 재고 목록에서 수정하세요");return}
  const id=UI.editRaw||uid("R");put("raws/"+id,r);logEvent(old?"입고 수정":"원료 입고",`[${r.site}] B/L ${bl} ${r.raw} ${old?fmtKg(num(old.inKg))+"→":""}${fmtKg(kg)}kg`,id);
  toast(old?"수정했습니다":"입고를 등록했습니다");UI.editRaw=null;$("#rawFormBox").innerHTML=rawForm();bindRaw()})}
function rawList(){const R=rawsArr(),low=num(S.cfg.lowStock)||0,soon=addDays(todayStr(),30);
  if(!R.length)return `<div class="empty">입고된 원료가 없습니다. 왼쪽에서 등록하세요. 등록하지 않은 원료도 출고는 직접 입력으로 할 수 있습니다.</div>`;
  const tot={};R.forEach(r=>{const x=Math.max(0,rawRemain(r));tot[r.raw]=(tot[r.raw]||0)+x});
  return `<div class="row" style="margin-bottom:10px">${Object.entries(tot).map(([k,v])=>`<span class="chip s2" style="font-size:13px">${esc(k)} ${fmtKg(v)}kg</span>`).join("")}</div>
  <div class="lotlist">${R.map(r=>{const rem=rawRemain(r),used=rawUsed(r.id);const st=rem<=0?`<span class="chip">소진</span>`:rem<low?`<span class="chip s1">부족</span>`:`<span class="chip s3">재고</span>`;
    return `<div class="lot" style="cursor:default"><div class="t">${esc(r.bl)} · ${esc(r.raw)}</div><div>${st}${r.rawExpiry&&r.rawExpiry<=soon&&rem>0?` <span class="chip bad">소비기한 임박</span>`:""}</div>
    <div class="m">[${esc(siteOf(r))}] 입고 ${esc(r.inDate)} ${fmtKg(num(r.inKg))}kg · 출고 ${fmtKg(used)}kg · <b class="pen">남은 ${fmtKg(rem)}kg</b> · ${esc(r.origin||"")} · 소비기한 ${esc(r.rawExpiry||"–")}</div>
    <div class="row" style="grid-column:1/-1"><button class="btn small" data-act="editRaw" data-id="${r.id}">수정</button>${delBtn(r.id,"raw","이 입고 기록을 삭제할까요?")}</div></div>`}).join("")}</div>`}
function relList(){
  const L=lotsArr();if(!L.length)return `<div class="empty">출고 기록이 없습니다. 왼쪽에서 첫 출고를 등록하세요.</div>`;
  return `<div class="lotlist">${L.slice(0,40).map(l=>{const c=calc(l);return `<div class="lot" style="cursor:default">
    <div class="t">${esc(l.bl)} · ${esc(lotTitle(l))}</div><div><span class="chip ${c.stageCls}">${c.stageLabel}</span></div>

/* ───────── 로트 선택 공통 ───────── */
function picker(kind){
  const sd=UI.showDone[kind];
  const okStage={wash:s=>s==="wash",heat:s=>s==="heat",pack:s=>s==="heat"||s==="pack"||s==="packing"}[kind];
  const doneStage={wash:s=>s!=="wash",heat:(s,l)=>s!=="wash"&&s!=="heat"&&prod(l.productId)?.needsHeat,pack:s=>s==="done"}[kind];
  let items;
  if(kind==="wash")items=lotsArr().map(l=>({u:{key:l.id,ids:[l.id],lot:l},c:calc(l)}));
  else items=unitsOf(lotsArr()).map(u=>({u,c:calcUnit(u.ids)}));
  items=items.filter(({u,c})=>okStage(c.stage)||(sd&&doneStage(c.stage,u.lot)));
  const selected=kind==="wash"?UI.washSel:keyIds(kind==="heat"?UI.heatUnit:UI.packUnit);
  const label={wash:"세척할 로트",heat:"가열할 로트",pack:"포장할 로트"}[kind],doneL={wash:"세척 끝난 로트도 보기",heat:"가열 끝난 로트도 보기",pack:"포장 완료도 보기"}[kind];
  const head=`<div class="row" style="justify-content:space-between;margin-bottom:8px"><h3 style="margin:0">${label}</h3>
    <label class="row" style="font-size:13px;color:var(--muted);gap:6px"><input type="checkbox" data-act="showDone" data-k="${kind}" ${sd?"checked":""} style="width:auto">${doneL}</label></div>
    ${kind==="wash"?`<label class="row multi" style="gap:8px;margin-bottom:10px;font-size:14px"><input type="checkbox" data-act="washMulti" ${UI.washMulti?"checked":""} style="width:auto"> 여러 로트(B/L)를 함께 세척</label>`:""}`;
  const empty={wash:"세척 대기 중인 로트가 없습니다. ‘① 원료육 출고’에서 먼저 등록하세요.",heat:"가열을 기다리는 로트가 없습니다. 가열 제품은 ‘기준·백업’에서 ‘가열’로 표시된 제품입니다.",pack:"세척이 끝난 로트가 없습니다. ‘② 세척 중량’을 먼저 입력하세요."}[kind];
  if(!items.length)return head+`<div class="empty">${empty}</div>`;
  return head+`<div class="lotlist">${items.map(({u,c})=>{const on=u.ids.every(id=>selected.includes(id));return `<button type="button" class="lot" data-act="pick" data-k="${kind}" data-v="${esc(u.key)}" aria-pressed="${on}">
    <span class="t">${kind==="wash"&&UI.washMulti?`<span class="ck" aria-hidden="true">${on?"✓":""}</span>`:""}${esc(kind==="wash"?lotTitle(u.lot):unitTitle(u))}</span><span><span class="chip ${c.stageCls}">${c.stageLabel}</span></span>
    <span class="m">B/L ${esc(kind==="wash"?u.lot.bl:unitBL(u))} · 출고 ${esc(u.lot.releaseDate)} ${fmtKg(c.rel)}kg${c.wash!=null?` · 세척 ${fmtKg(c.wash)}kg`:""}${c.group&&kind==="wash"?" · 묶음":""}</span></button>`}).join("")}</div>`}

/* ───────── ② 세척 ───────── */
function rWash(){UI.washSel=UI.washSel.filter(id=>S.lots[id]&&!S.lots[id].deleted);slot("washPick",()=>picker("wash"));
  return `<div><h2>② 세척 중량 입력</h2><p class="lead">현장에서 저울에 단 해동 후·세척 후 중량을 넣으면 세척 수율이 바로 계산됩니다. 여러 B/L을 한꺼번에 세척했다면 ‘함께 세척’을 켜고 합계 중량을 넣으세요.</p></div>
  <div class="grid2"><div class="card" id="washPick"></div><div id="washForm">${washForm()}</div></div>`}
function washExisting(lots){const ids=lots.map(l=>l.id).sort().join("+");
  if(lots.length>1){const g=lots[0].wash&&lots[0].wash.group;if(g&&g.lotIds.slice().sort().join("+")===ids)return {...lots[0].wash,thawKg:g.thawKg,kg:g.kg,aKg:g.aKg,fatKg:g.fatKg,wasteKg:g.wasteKg,group:g};return null}
  return lots[0].wash||null}
function washForm(){
  const lots=UI.washSel.map(id=>S.lots[id]).filter(Boolean);
  if(!lots.length)return `<div class="card"><div class="empty">왼쪽에서 로트를 고르세요.${UI.washMulti?" 함께 세척한 로트를 모두 누르세요.":""}</div></div>`;
  const w=washExisting(lots)||{},p=prod(lots[0].productId),rel=sum(lots,l=>num(l.releaseKg)),multi=lots.length>1;
  const mixed=new Set(lots.map(l=>l.productId)).size>1;
  return `<form class="card" id="wForm" autocomplete="off"><h3>${multi?`함께 세척 · ${lots.length}개 로트`:esc(lotTitle(lots[0]))}</h3>
   <p class="formula" style="margin:-4px 0 12px">${lots.map(l=>`B/L ${esc(l.bl)} (${fmtKg(num(l.releaseKg))}kg)`).join(" · ")} · 출고 합계 <b class="pen">${fmtKg(rel)}kg</b> · 기준 세척 수율 ${p&&p.stdWash!=null?p.stdWash+"%":"–"}${w.by?` · 마지막 입력 ${esc(w.by)}`:""}</p>
   ${mixed?`<p class="banner" style="margin:0 0 12px">제품이 다른 로트를 묶었습니다. 기준 수율은 첫 로트(${esc(lotTitle(lots[0]))}) 기준으로 비교합니다.</p>`:""}
   <div class="fields">
    <label class="f"><b>세척일</b><input type="date" id="w_date" value="${esc(w.date||todayStr())}"></label>
    <label class="f"><b>해동 후 중량${multi?" (합계)":""}</b><span class="unit"><input id="w_thaw" class="num big" inputmode="decimal" enterkeyhint="next" value="${esc(w.thawKg!=null?+(+w.thawKg).toFixed(2):"")}" placeholder="0"><span>kg</span></span></label>
    <label class="f"><b>세척 후 중량${multi?" (합계)":""}</b><span class="unit"><input id="w_kg" class="num big" inputmode="decimal" enterkeyhint="next" value="${esc(w.kg!=null?+(+w.kg).toFixed(2):"")}" placeholder="0"><span>kg</span></span></label>
    <label class="f"><b>A막창</b><span class="unit"><input id="w_a" class="num" inputmode="decimal" enterkeyhint="next" value="${esc(w.aKg??"")}"><span>kg</span></span></label>
    <label class="f"><b>지방</b><span class="unit"><input id="w_fat" class="num" inputmode="decimal" enterkeyhint="next" value="${esc(w.fatKg??"")}"><span>kg</span></span></label>
    <label class="f"><b>폐기 막창</b><span class="unit"><input id="w_waste" class="num" inputmode="decimal" enterkeyhint="next" value="${esc(w.wasteKg??"")}"><span>kg</span></span></label>
   </div>${multi?`<p class="formula" style="margin:10px 0 0">합계 중량은 출고 중량 비율로 각 로트에 나눠 기록됩니다. 일지에는 로트별로 나뉜 값이 들어갑니다.</p>`:""}
   <div id="wPrev" style="margin-top:14px"></div>
   <div class="row end" style="margin-top:14px">${w.group?(UI.confirm==="ungroup"?`<span class="confirm">묶음을 풀면 세척 기록이 지워져 다시 입력해야 합니다. <button type="button" class="btn small danger" data-act="ungroup">묶음 풀기</button><button type="button" class="btn small" data-act="noConfirm">취소</button></span>`:`<button type="button" class="btn" data-act="askDel" data-id="ungroup">묶음 풀기</button>`):""}<button class="btn primary" type="submit">${washExisting(lots)?"세척 중량 수정":"세척 중량 저장"}</button></div></form>`}
function readWash(){return {date:$("#w_date").value,thawKg:num($("#w_thaw").value),kg:num($("#w_kg").value),aKg:num($("#w_a").value),fatKg:num($("#w_fat").value),wasteKg:num($("#w_waste").value)}}
function wPrev(){const el=$("#wPrev");if(!el)return;const lots=UI.washSel.map(id=>S.lots[id]).filter(Boolean);if(!lots.length)return;const w=readWash(),p=prod(lots[0].productId);
  const o=ratios({rel:sum(lots,l=>num(l.releaseKg)),thaw:w.thawKg,wash:w.kg,heatIn:null,heatOut:null,packKg:0,qty:0,remainKg:0,wasteKg:0,sauceKg:0,nPacks:0});
  const ws=warnings({...lots[0],id:"__tmp",wash:{...w},heat:null},o),d=o.washYield!=null&&p&&num(p.stdWash)?o.washYield*100-p.stdWash:null;
  el.innerHTML=`<div class="calc"><div class="kpi ${kcls(o.washYield,p?.stdWash)}"><div class="l">세척 수율</div><div class="v">${pct(o.washYield)}</div><div class="d">세척 ÷ 해동${d!=null?` · 기준 대비 ${d>0?"+":""}${d.toFixed(1)}%p`:""}</div></div>
  <div class="kpi"><div class="l">출고 대비</div><div class="v">${pct(o.washVsRel)}</div><div class="d">세척 ÷ 출고 ${fmtKg(o.rel)}kg</div></div>
  <div class="kpi"><div class="l">작업일지 ‘세척중량’</div><div class="v">${o.washYield!=null?fmt(o.rel*o.washYield,0):"–"}<small>kg</small></div><div class="d">원육 × 수율 (환산)</div></div></div>${warnList(ws)}`}
function bindWash(){const f=$("#wForm");if(!f)return;wPrev();f.addEventListener("input",wPrev);
  f.addEventListener("submit",ev=>{ev.preventDefault();if(needWho())return;const w=readWash();
    if(w.kg==null||w.thawKg==null){toast("해동 후 중량과 세척 후 중량을 모두 입력하세요");return}
    const lots=UI.washSel.map(id=>S.lots[id]).filter(Boolean),old=washExisting(lots),rel=sum(lots,l=>num(l.releaseKg)),now=new Date().toISOString();
    if(lots.length===1){const l=clone(lots[0]);l.wash={...w,by:who(),at:now};put("lots/"+l.id,l,true)}
    else{const gid=(old&&old.group&&old.group.id)||uid("G"),ids=lots.map(l=>l.id),sc=(v,s)=>v==null?null:Math.round(v*s*1000)/1000;
      lots.forEach(l0=>{const l=clone(l0),s=(num(l.releaseKg)||0)/rel;l.wash={date:w.date,by:who(),at:now,thawKg:sc(w.thawKg,s),kg:sc(w.kg,s),aKg:sc(w.aKg,s),fatKg:sc(w.fatKg,s),wasteKg:sc(w.wasteKg,s),group:{id:gid,lotIds:ids,thawKg:w.thawKg,kg:w.kg,aKg:w.aKg,fatKg:w.fatKg,wasteKg:w.wasteKg}};put("lots/"+l.id,l,true)})}
    const bls=lots.map(l=>l.bl).join("+");
    logEvent(old?"세척 수정":"세척 저장",`B/L ${bls} 해동 ${old?fmtKg(num(old.thawKg))+"→":""}${fmtKg(w.thawKg)} · 세척 ${old?fmtKg(num(old.kg))+"→":""}${fmtKg(w.kg)}kg (${pct(w.kg/w.thawKg)})`,lots[0].id);
    toast("세척 중량을 저장했습니다 · 세척 수율 "+pct(w.kg/w.thawKg));UI.washSel=[];UI.washMulti=false;refresh();$("#washForm").innerHTML=washForm()})}
rWash.after=bindWash;

/* ───────── ③ 가열 ───────── */
function rHeat(){if(UI.heatUnit&&!keyIds(UI.heatUnit).every(id=>S.lots[id]))UI.heatUnit=null;slot("heatPick",()=>picker("heat"));
  return `<div><h2>③ 가열 후 중량 <span class="chip">가열 제품만</span></h2><p class="lead">훈제·초벌처럼 가열하는 제품의 2차 수율입니다. 가열 전·후 중량을 재서 넣으세요. 가열하지 않는 제품은 이 단계를 건너뜁니다.</p></div>
  <div class="grid2"><div class="card" id="heatPick"></div><div id="heatForm">${heatForm()}</div></div>`}
function heatForm(){
  const ids=keyIds(UI.heatUnit);if(!ids.length)return `<div class="card"><div class="empty">왼쪽에서 로트를 고르세요.</div></div>`;
  const o=calcUnit(ids),l=o.lots[0],p=prod(l.productId),h0=l.heat||{},h=h0.group?{...h0,inKg:h0.group.inKg,outKg:h0.group.outKg}:h0;
  return `<form class="card" id="hForm" autocomplete="off"><h3>${esc(unitTitle({ids,lot:l}))}</h3>
   <p class="formula" style="margin:-4px 0 12px">B/L ${esc(unitBL({ids}))} · 세척 <b class="pen">${fmtKg(o.wash)}kg</b> · 기준 가열 수율 ${p&&p.stdHeat!=null?p.stdHeat+"%":"미정"}${h.by?` · 마지막 입력 ${esc(h.by)}`:""}</p>
   <div class="fields">
    <label class="f"><b>가열일</b><input type="date" id="h_date" value="${esc(h.date||todayStr())}"></label>
    <label class="f"><b>가열 전 중량</b><span class="unit"><input id="h_in" class="num big" inputmode="decimal" enterkeyhint="next" value="${esc(h.inKg!=null?+(+h.inKg).toFixed(2):(o.wash!=null?+o.wash.toFixed(2):""))}"><span>kg</span></span></label>
    <label class="f"><b>가열 후 중량</b><span class="unit"><input id="h_out" class="num big" inputmode="decimal" enterkeyhint="next" value="${esc(h.outKg!=null?+(+h.outKg).toFixed(2):"")}" placeholder="0"><span>kg</span></span></label>
    <label class="f"><b>시작</b><input type="time" id="h_start" value="${esc(h.start||"")}"></label>
    <label class="f"><b>종료</b><input type="time" id="h_end" value="${esc(h.end||"")}"></label>
   </div><p class="formula" style="margin:8px 0 0">가열 전 중량에는 양념을 버무린 뒤라면 양념 무게가 포함됩니다. 기본값은 세척 중량입니다.</p>
   <div id="hPrev" style="margin-top:14px"></div>
   <div class="row end" style="margin-top:14px"><button class="btn primary" type="submit">${h.outKg!=null?"가열 중량 수정":"가열 중량 저장"}</button></div></form>`}
function readHeat(){return {date:$("#h_date").value,inKg:num($("#h_in").value),outKg:num($("#h_out").value),start:$("#h_start").value,end:$("#h_end").value}}
function hPrev(){const el=$("#hPrev");if(!el)return;const ids=keyIds(UI.heatUnit),l=S.lots[ids[0]],p=prod(l.productId),h=readHeat();
  const y=h.inKg&&h.outKg?h.outKg/h.inKg:null,o=calcUnit(ids);

function am(l){const c=calc(l),p=prod(l.productId)||{},sw=(num(p.stdWash)||0)/100,sp=(num(p.stdPack)||0)/100,stdTot=sw*sp,done=c.nPacks>0&&!!c.thaw;
  const tot=done?c.acc/c.thaw:null,dev=done&&stdTot?(tot-stdTot)*100:null,price=num(S.prices[l.productId]),lossKg=done&&stdTot?c.thaw-c.acc/stdTot:null;
  return {...c,l,p,stdTot,done,tot,dev,price,lossKg,won:lossKg!=null&&price?lossKg*price:null,

function aAgg(ms){const d=ms.filter(m=>m.done&&m.stdTot),thaw=sum(d,m=>m.thaw),acc=sum(d,m=>m.acc),std=sum(d,m=>m.thaw*m.stdTot),pr=d.filter(m=>m.won!=null);
  const H=ms.filter(m=>m.heatYield!=null),W=ms.filter(m=>m.washYield!=null),P=ms.filter(m=>m.packYield!=null);
  const rel=sum(d,m=>m.rel);
  return {rel,s1:W.length?sum(W,m=>m.wash)/sum(W,m=>m.rel):null,s2:H.length?sum(H,m=>m.heatOut)/sum(H,m=>m.rel):null,s3:rel?sum(d,m=>m.packKg)/rel:null,n:d.length,thaw,acc,std,pack:sum(d,m=>m.packKg),qty:sum(d,m=>m.qty),waste:sum(d,m=>m.wasteKg),wash:sum(d,m=>m.wash),

    tot:thaw?acc/thaw:null,stdTot:thaw?std/thaw:null,dev:thaw?(acc-std)/thaw*100:null,won:pr.length?sum(pr,m=>m.won):null,unpriced:d.length-pr.length,lossKg:sum(d,m=>m.lossKg)}}

  if(rg[0]&&rg[0].dev<-tol/2)out.push({s:"warn",t:`원료 ${rg[0].k}의 세척 수율이 기준보다 평균 ${Math.abs(rg[0].dev).toFixed(1)}%p 낮습니다`,d:"세척 수율이 낮으면 원료 교체를 검토합니다",go:"비교 보기",act:"aView",v:"compare"});

function trendChart(done){
  const kf=UI.tUnit==="week"?weekStart:UI.tUnit==="month"?(d=>d.slice(0,7)):(d=>d),g=groupBy(done.filter(m=>m.dev!=null),m=>kf(m.date)),days=Object.keys(g).sort().slice(-30).map(d=>({d,...aAgg(g[d])}));
  const lab=d=>UI.tUnit==="month"?d.slice(2).replace("-","."):UI.tUnit==="week"?d.slice(5).replace("-","/")+"~":d.slice(5).replace("-","/");
  if(!days.length)return `<div class="empty">포장까지 끝난 로트가 없습니다.</div>`;
  const W=640,H=230,m={l:40,r:16,t:16,b:30},lo=Math.min(-4,Math.floor(Math.min(...days.map(x=>x.dev))-.5)),hi=Math.max(2,Math.ceil(Math.max(...days.map(x=>x.dev))+.5));
  const Y=v=>m.t+(hi-v)/(hi-lo)*(H-m.t-m.b),sl=(W-m.l-m.r)/Math.max(days.length,7),bw=Math.min(36,sl*.6),X=i=>m.l+sl*i+sl/2;let g2="";
  for(let v=lo;v<=hi;v++)g2+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="${v===0?1.2:.6}"/><text x="${m.l-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v>0?"+":""}${v}</text>`;
  const ref=[[-1,"var(--warn)"],[-3,"var(--bad)"]].map(([v,c])=>`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="${c}" stroke-dasharray="4 4"/>`).join("");
  const bars=days.map((x,i)=>{const s=aStatus(x.dev),y1=Y(Math.max(0,x.dev)),y2=Y(Math.min(0,x.dev));return `<rect x="${X(i)-bw/2}" y="${y1}" width="${bw}" height="${Math.max(1.5,y2-y1)}" rx="2" fill="var(--${s==="good"?"pen":s==="warn"?"warn":"bad"})"><title>${x.d} · ${sgn(x.dev)}%p · ${x.n}로트</title></rect>`+((days.length<=10||i%Math.ceil(days.length/8)===0)?`<text x="${X(i)}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--muted)">${lab(x.d)}</text>`:"")}).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="일별 기준 대비 종합 수율">${g2}${ref}${bars}<text x="${m.l-6}" y="10" text-anchor="end" font-size="11" fill="var(--muted)">%p</text></svg>`}

function aFlow(){

    title=`${unitTitle({ids,lot:l})} · B/L ${unitBL({ids})}`;sub=`출고 ${l.releaseDate} · 세척 ${l.wash?.date||"–"}${l.heat?.date?" · 가열 "+l.heat.date:""} · 포장 ${lastPackDate(l)||"–"}`;f=o.nPacks?o:null;rows=ids.map(id=>am(S.lots[id]))}
  else if(sel.startsWith("p:")){const pid=sel.slice(2),list=ms.filter(m=>m.done&&m.l.productId===pid);stdP=prod(pid);title=`${stdP?.name||""} · 기간 합계`;sub=`포장 완료 로트 ${list.length}건`;
    if(list.length){f=ratios(sumRaw(list.map(m=>raw(m.l))))}rows=list}
  const opts=`<select data-act="flowSel" style="width:auto;max-width:100%"><optgroup label="제품 합계">${prodArr().map(p=>`<option value="p:${p.id}" ${sel==="p:"+p.id?"selected":""}>${esc(p.name)}</option>`).join("")}</optgroup><optgroup label="로트">${ms.map(m=>`<option value="l:${m.l.id}" ${sel==="l:"+m.l.id?"selected":""}>${esc(m.l.bl)} · ${esc(lotTitle(m.l))}</option>`).join("")}</optgroup></select>`;
  let stage="";if(rows.length){const a=aAgg(rows),p=stdP||{},rel=sum(rows,m=>m.rel),th=sum(rows,m=>m.thaw),tol=num(S.cfg.tol)||10;
    const it=[{name:"해동 (출고 대비)",sub:`${fmt(rel,0)} → ${fmt(th,0)}kg · 기준 없음`,dev:null,meta:pct(rel?th/rel:null)},
      {name:"세척",sub:`${pct(a.washY)} · 기준 ${p.stdWash??"–"}%`,dev:a.washY!=null&&num(p.stdWash)?a.washY*100-p.stdWash:null,meta:"세척 ÷ 해동"},
      ...(a.heatY!=null||p.needsHeat?[{name:"가열 (2차)",sub:`${pct(a.heatY)} · 기준 ${p.stdHeat??"미정"}${p.stdHeat!=null?"%":""}`,dev:a.heatY!=null&&num(p.stdHeat)?a.heatY*100-p.stdHeat:null,meta:"가열 후 ÷ 가열 전"}]:[]),
      {name:"포장",sub:`${pct(a.packY)} · 기준 ${p.stdPack??"–"}%`,dev:a.packY!=null&&num(p.stdPack)?a.packY*100-p.stdPack:null,meta:"(포장+잔량+폐기) ÷ 세척"},
      {name:"종합",sub:`${pct(a.tot)} · 기준 ${pct(a.stdTot)}`,dev:a.dev,meta:"(포장+잔량+폐기) ÷ 해동"}];
    stage=rank(it.map(i=>({...i,st:i.dev==null?"run":i.name==="종합"?aStatus(i.dev):Math.abs(i.dev)>tol?"crit":aStatus(i.dev)})),"계산식")}
  const lotRows=ms.map(m=>`<tr class="click${sel==="l:"+m.l.id?" sel":""}" data-act="flowLot" data-v="${m.l.id}" tabindex="0"><td>${esc(m.date)}</td><td>${esc(m.l.bl)}${m.group?` <span class="chip">묶음</span>`:""}<small>${esc(m.l.raw)} · ${esc(m.l.origin||"")}</small></td><td>${esc(lotTitle(m.l))}</td>
    <td class="n">${fmtKg(m.thaw)} → ${m.done?fmt(m.packKg,0):"–"}</td><td class="n">${pct(m.washYield)}</td><td class="n">${pct(m.heatYield)}</td><td class="n">${pct(m.packYield)}</td><td class="n">${m.dev!=null?sgn(m.dev)+"%p":"–"}</td><td class="n">${m.won!=null?won(m.won):"–"}</td>
    <td>${m.done?aPill(aStatus(m.dev)):`<span class="chip ${m.stageCls}">${m.stageLabel}</span>`}${m.warns.length?` <span class="chip bad">입력 확인 ${m.warns.length}</span>`:""}</td></tr>`).join("");
  const ws=rows.flatMap(m=>m.warns.map(w=>({...w,bl:m.l.bl})));
  return `<div class="card" style="display:grid;gap:12px"><div class="row" style="justify-content:space-between"><div><h3 style="margin:0">공정별 중량 흐름</h3><p class="formula" style="margin:2px 0 0">${esc(title)} · ${esc(sub)}</p></div>${opts}</div>
   <div class="legend"><span><i style="background:var(--pen)"></i>투입·완제품</span><span><i style="background:var(--loss)"></i>감량·손실</span><span><i style="background:var(--gain)"></i>증량(물·양념)</span><span><i style="background:var(--line)"></i>출고 라벨 중량(참고)</span></div>

function waterfall(o){
  const bars=[{lab:"출고(라벨)",k:"ref",a:0,b:o.rel},{lab:"해동 후",k:"tot",a:0,b:o.thaw}];let run=o.thaw;

const CHK_COLS=[["bl",/이력|b\/?l|^bl|로트|lot/i,"B/L"],["thaw",/해동/,"해동"],["wash",/세척|실사용|실 사용/,"세척"],["heat",/가열/,"가열 후"],["qty",/수량|ea/i,"포장수량"],["remain",/잔량/,"잔량(g)"],["waste",/폐기/,"폐기(g)"]];

function chkParse(rows,src){
  const hi=rows.slice(0,15).findIndex(r=>(r||[]).some(c=>CHK_COLS[0][1].test(String(c??"").trim())));
  if(hi<0){toast("이력번호(B/L) 열을 찾지 못했습니다. 머리글에 ‘이력번호’나 ‘B/L’이 있어야 합니다");return}
  const Hd=rows[hi].map(c=>String(c??"").trim()),idx={},used=new Set();
  CHK_COLS.forEach(([k,re])=>{const i=Hd.findIndex((h,j)=>!used.has(j)&&re.test(h)&&!/수율|예상|기준/.test(h));if(i>=0){idx[k]=i;used.add(i)}});
  const body=rows.slice(hi+1).filter(r=>r&&r[idx.bl]!=null&&String(r[idx.bl]).replace(/\D/g,"").length>=3);
  UI.chk={src,cols:Object.keys(idx).map(k=>CHK_COLS.find(c=>c[0]===k)[2]+"="+Hd[idx[k]]).join(", "),
    rows:body.map(r=>{const o={bl:String(r[idx.bl]).replace(/\D/g,"")};Object.keys(CHK_LBL).forEach(k=>{if(idx[k]!=null){const v=num(String(r[idx[k]]??"").replace(/[^\d.\-]/g,""));if(v!=null)o[k]=v}});return o})};
  refresh();toast(`${UI.chk.rows.length}행을 읽었습니다`)}
function chkTextRows(t){const lines=t.replace(/\r/g,"").split("\n").filter(x=>x.trim());const d=lines[0]&&lines[0].includes("\t")?"\t":",";return lines.map(l=>l.split(d).map(x=>x.replace(/^"|"$/g,"").trim()))}
function appVals(l){const c=calc(l);return {thaw:c.thaw,wash:c.wash,heat:c.heatOut,qty:c.nPacks?Math.round(c.qty):null,remain:c.nPacks?Math.round(c.remainKg*1000):null,waste:c.nPacks?Math.round(c.wasteKg*1000):null}}
function chkCause(k,app,paper,lotId){const d=paper-app;
  if(Math.abs(d)<1&&Math.round(app)===Math.round(paper))return "정수 반올림";
  if(app&&(Math.abs(paper/app-10)<.05||Math.abs(paper/app-.1)<.005))return "소수점 잘못 찍힘";
  if(k!=="remain"&&k!=="waste"&&(Math.abs(paper/app-1000)<1||Math.abs(paper*1000-app)<1))return "단위(kg·g) 혼동";
  const a=String(Math.round(app)),b=String(Math.round(paper));if(a.length===b.length&&a!==b&&[...a].sort().join("")===[...b].sort().join(""))return "자릿수 뒤바뀜";
  const o=Object.values(S.lots).find(x=>!x.deleted&&x.id!==lotId&&appVals(x)[k]!=null&&Math.abs(appVals(x)[k]-paper)<.5);if(o)return `다른 로트 값 기입 (B/L ${o.bl})`;
  if(app&&Math.abs(d/app)<=.03)return "저울 값 옮겨 적기 차이";return "원인 확인 필요"}
function chkResult(r){
  const byBl={};Object.values(S.lots).filter(l=>!l.deleted).forEach(l=>{byBl[String(l.bl).replace(/\D/g,"")]=l});
  const items=[],missing=[];
  r.rows.forEach(row=>{const l=byBl[row.bl];if(!l){missing.push(row.bl);return}const av=appVals(l);
    Object.keys(CHK_LBL).forEach(k=>{if(row[k]==null)return;const app=av[k],tol=k==="qty"?0:k==="remain"||k==="waste"?5:0.5;
      if(app==null){items.push({l,k,paper:row[k],app:null,st:"앱 미입력"});return}
      const ok=Math.abs(row[k]-app)<=tol;items.push({l,k,paper:row[k],app,st:ok?"일치":chkCause(k,app,row[k],l.id),ok})})});
  const inFile=new Set(r.rows.map(x=>x.bl)),notIn=lotsArr().filter(l=>l.releaseDate>=addDays(todayStr(),-30)&&l.wash&&!inFile.has(String(l.bl).replace(/\D/g,"")));

   <div class="kpi ${bad.length?"bad":"ok"}"><div class="l">차이</div><div class="v">${bad.length}</div><div class="d">앱 값과 다른 항목</div></div>
   <div class="kpi ${missing.length?"warn":""}"><div class="l">앱에 없는 B/L</div><div class="v">${missing.length}</div><div class="d">${esc(missing.slice(0,3).join(", "))}${missing.length>3?" 외":""}</div></div>
   <div class="kpi"><div class="l">파일에 없는 로트</div><div class="v">${notIn.length}</div><div class="d">최근 30일 · 세척까지 입력된 로트</div></div></div>
  <div class="card"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h3 style="margin:0">${UI.chkAll?"전체 항목":"차이 나는 항목"}</h3><label class="row" style="gap:6px;font-size:13px;color:var(--muted)"><input type="checkbox" data-act="chkAll" ${UI.chkAll?"checked":""} style="width:auto">일치한 항목도 보기</label></div>
  ${show.length?`<div class="tbl-wrap"><table class="t"><thead><tr><th>B/L</th><th>제품</th><th>항목</th><th>수기 값</th><th>앱 값</th><th>차이</th><th>판정 · 추정 원인</th></tr></thead><tbody>
  ${show.map(x=>`<tr><td>${esc(x.l.bl)}${calc(x.l).group?` <span class="chip">묶음</span>`:""}</td><td>${esc(lotTitle(x.l))}</td><td>${CHK_LBL[x.k]}</td><td class="n">${fmtKg(x.paper)}</td><td class="n">${fmtKg(x.app)}</td><td class="n">${x.app==null?"–":sgn(x.paper-x.app)}</td><td><span class="chip ${x.ok?"s3":x.st==="앱 미입력"?"s1":"bad"}">${esc(x.st)}</span></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">${items.length?"모든 항목이 일치합니다.":"맞춰 볼 항목이 없습니다. 열 머리글을 확인하세요."}</div>`}
  <p class="formula" style="margin:8px 0 0">묶음 세척 로트는 앱에서 합계를 로트별로 나눠 기록하므로, 수기에 합계로 적었다면 차이로 보일 수 있습니다.</p></div>`}

const SESS_KEY=LKEY+"-session",LASTID_KEY=LKEY+"-lastid";
async function sha(s){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch{let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return "x"+(h>>>0).toString(16)}}
async function pbkdf2(salt,pw){try{const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);const b=await crypto.subtle.deriveBits({name:"PBKDF2",salt:new TextEncoder().encode(salt),iterations:100000,hash:"SHA-256"},k,256);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch{return sha(salt+":"+pw)}}
const pwCheck=async(w,pw)=>w&&w.pinHash&&(w.algo==="pbkdf2"?await pbkdf2(w.salt,pw):await sha(w.salt+":"+pw))===w.pinHash;

const pinStaff=()=>staffList().filter(w=>w.pinHash||w.hasPin);
const managers=()=>pinStaff().filter(w=>w.role==="manager");

const loginOn=()=>SERVER?true:(!!S.cfg.loginRequired&&pinStaff().length>0);
function getSess(){const s=ls.get(SESS_KEY);if(!s||!s.id||(SERVER&&!s.token))return null;const w=S.staff[s.id];if(!w||w.deleted||(!w.pinHash&&!w.hasPin))return null;return {id:w.id,name:w.name,role:w.role||"worker",loginId:w.loginId||""}}

function startSess(w){ls.set(SESS_KEY,{id:w.id,at:Date.now()});lastAct=Date.now();UI.login={step:"login"};logEvent("로그인",w.role==="manager"?"관리자":"",w.id);lastGate=false;render();toast(`${w.name} 님, 반갑습니다`)}
async function srvPost(url,body){const x=ls.get(SESS_KEY)||{};const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json",...(x.token?{"Authorization":"Bearer "+x.token}:{})},body:JSON.stringify(body||{})});let j={};try{j=await r.json()}catch{}return {...j,ok:r.ok,status:r.status}}
function logout(reason){if(SERVER){const x=ls.get(SESS_KEY)||{};try{fetch("/api/logout",{method:"POST",headers:{"Authorization":"Bearer "+(x.token||"")},keepalive:true})}catch{}ls.set(SESS_KEY,null);if(reason)ls.set(LKEY+"-msg",reason);location.reload();return}const s=getSess();if(s)logEvent("로그아웃",reason||"",s.id);ls.set(SESS_KEY,null);UI.login={step:"login"};lastGate=null;render();if(reason)toast(reason)}
["pointerdown","keydown"].forEach(ev=>addEventListener(ev,()=>{lastAct=Date.now()},{passive:true,capture:true}));
setInterval(()=>{if(!loginOn()||!getSess())return;const m=num(S.cfg.autoLogout)||0;if(m&&Date.now()-lastAct>m*60000)logout(`${m}분 동안 쓰지 않아 자동으로 로그아웃했습니다`)},30000);
const gated=()=>loginOn()&&!getSess();
const pub=()=>window.__YIELD_PUBLIC__||null;
const canRegister=()=>!SERVER||!pub()||pub().allowRegister!==false;
const fld=(id,label,type,extra)=>`<label class="f"><b>${label}</b><input id="${id}" ${type==="pw"?'type="password"':'autocapitalize="none" autocorrect="off" spellcheck="false"'} ${extra||""}></label>`;
function loginScreen(){const L=UI.login||(UI.login={step:"login"});L.loading=false;
  const card=(inner,id)=>`<div class="loginwrap"><form class="card login" id="${id}" autocomplete="on" novalidate><div class="brandmark">코리아식품 수율 일지</div>${inner}</form></div>`;
  const err=L.err?`<p class="loginerr" role="alert">${esc(L.err)}</p>`:"";
  if(SERVER&&!pub()){L.loading=true;return `<div class="loginwrap"><div class="card login"><p class="lead">서버에 연결하는 중…</p></div></div>`}
  if(SERVER&&pub().setupNeeded)return card(`<h2>처음 설정</h2><p class="lead">관리자 계정을 먼저 만듭니다. 이 아이디로 관리자 화면(기준값·보고서·백업)에 들어갑니다.</p>
    <div class="fields lf">${fld("su_id","관리자 아이디","text",`autocomplete="username" placeholder="영문·숫자 3~20자" value="${esc(L.loginId||"")}"`)}${fld("su_name","이름 (기록에 남는 이름)","text",`value="${esc(L.name||"")}"`)}
    ${fld("su_pw","비밀번호","pw",'autocomplete="new-password" placeholder="4자 이상"')}${fld("su_pw2","비밀번호 확인","pw",'autocomplete="new-password"')}</div>
    ${err}<button class="btn primary loginbtn" type="submit">관리자 만들고 시작</button>`,"setupForm");
  if(L.step==="reg")return card(`<h2>회원가입</h2><p class="lead">아이디와 비밀번호를 정하세요. 이름은 작업 기록에 입력자로 남습니다.</p>
    <div class="fields lf">${fld("rg_id","아이디","text",`autocomplete="username" placeholder="영문·숫자 3~20자" value="${esc(L.loginId||"")}"`)}${fld("rg_name","이름","text",`value="${esc(L.name||"")}"`)}
    ${fld("rg_pw","비밀번호","pw",'autocomplete="new-password" placeholder="4자 이상"')}${fld("rg_pw2","비밀번호 확인","pw",'autocomplete="new-password"')}</div>
    ${err}<button class="btn primary loginbtn" type="submit">가입하고 시작</button><button type="button" class="linkbtn" data-act="loginBack" style="justify-self:center">로그인 화면으로</button>`,"regForm");
  const locked=L.lockUntil&&Date.now()<L.lockUntil,last=ls.get(LASTID_KEY)||"";
  return card(`<h2>로그인</h2><p class="lead">아이디와 비밀번호를 입력하세요.${UI.site?` · ${esc(UI.site)}`:""}</p>
    <div class="fields lf">${fld("lg_id","아이디","text",`autocomplete="username" value="${esc(L.loginId??last)}"`)}${fld("lg_pw","비밀번호","pw",'autocomplete="current-password"')}</div>
    <label class="row keep"><input type="checkbox" id="lg_keep" ${L.keep===false?"":"checked"}> 아이디 기억하기</label>
    ${err}<button class="btn primary loginbtn" type="submit" ${locked?"disabled":""}>로그인</button>
    <div class="row" style="justify-content:space-between">${canRegister()?`<button type="button" class="linkbtn" data-act="regShow">회원가입</button>`:"<span></span>"}<span class="formula">비밀번호를 잊으면 관리자에게 문의하세요</span></div>
    ${num(S.cfg.autoLogout)?`<p class="formula" style="margin:0;text-align:center">${num(S.cfg.autoLogout)}분 동안 쓰지 않으면 자동으로 로그아웃됩니다</p>`:""}`,"loginForm")}
function renderLogin(){live=[];$("#view").innerHTML=loginScreen();
  const bind=(id,fn,first)=>{const f=$("#"+id);if(!f)return;f.addEventListener("submit",ev=>{ev.preventDefault();fn()});const i=$(first);if(i)(i.value?($("#"+id+" input[type=password]")||i):i).focus()};
  bind("loginForm",loginSubmit,"#lg_id");bind("regForm",regSubmit,"#rg_id");bind("setupForm",setupSubmit,"#su_id")}
async function loginSubmit(){const L=UI.login,lid=normId($("#lg_id").value),pw=$("#lg_pw").value,keep=$("#lg_keep").checked;L.loginId=$("#lg_id").value;L.keep=keep;
  const fail=m=>{L.err=m;renderLogin()};if(!lid||!pw)return fail("아이디와 비밀번호를 입력하세요");
  if(L.lockUntil&&Date.now()<L.lockUntil)return;
  ls.set(LASTID_KEY,keep?lid:null);
  if(SERVER){let r;try{r=await srvPost("/api/login",{loginId:lid,password:pw})}catch{r={error:"서버에 연결할 수 없습니다. 서버 PC가 켜져 있는지 확인하세요."}}
    if(r.ok){ls.set(SESS_KEY,{id:r.id,token:r.token});location.reload();return}
    if(r.lockSec){L.lockUntil=Date.now()+r.lockSec*1000;setTimeout(()=>{if(UI.login===L){L.err="";L.lockUntil=0;if(gated())renderLogin()}},r.lockSec*1000)}
    return fail(r.error||"로그인하지 못했습니다")}
  const w=staffById(lid),t=(L.tries=L.tries||{});
  if(await pwCheck(w,pw)){delete t[lid];startSess(w);return}
  t[lid]=(t[lid]||0)+1;
  if(t[lid]>=5){t[lid]=0;L.lockUntil=Date.now()+30000;setTimeout(()=>{if(UI.login===L){L.err="";L.lockUntil=0;if(gated())renderLogin()}},30000);return fail("5번 틀렸습니다. 30초 뒤에 다시 시도하세요.")}
  fail(`아이디 또는 비밀번호가 맞지 않습니다 (${t[lid]}/5)`)}
function readAcct(p){return {lid:normId($("#"+p+"_id").value),name:normName($("#"+p+"_name").value),p1:$("#"+p+"_pw").value,p2:$("#"+p+"_pw2").value}}
function acctError(a){if(!ID_RE.test(a.lid))return "아이디는 영문·숫자 3~20자입니다 (. _ - 사용 가능)";if(!a.name)return "이름을 입력하세요";if(!pwOk(a.p1))return "비밀번호는 4자 이상입니다";if(a.p1!==a.p2)return "비밀번호 확인이 다릅니다";return ""}
async function regSubmit(){const L=UI.login,a=readAcct("rg");L.loginId=$("#rg_id").value;L.name=a.name;const fail=m=>{L.err=m;renderLogin()};
  const e=acctError(a);if(e)return fail(e);
  if(SERVER){let r;try{r=await srvPost("/api/register",{loginId:a.lid,name:a.name,password:a.p1})}catch{r={error:"서버에 연결할 수 없습니다"}}if(r.ok){ls.set(SESS_KEY,{id:r.id,token:r.token});location.reload();return}return fail(r.error||"가입하지 못했습니다")}
  if(staffById(a.lid))return fail("이미 쓰고 있는 아이디입니다");
  const key=a.name.replace(/\s/g,""),ex=staffList().find(w=>!w.pinHash&&!w.loginId&&normName(w.name).replace(/\s/g,"")===key);
  const id=ex?ex.id:uid("w"),rec={...(ex?clone(ex):{createdAt:new Date().toISOString(),role:"worker",addedBy:"self"}),loginId:a.lid,name:ex?ex.name:a.name,...await pwFields(a.p1)};delete rec.id;
  put("staff/"+id,rec,true);S.staff[id]={...rec,id};ls.set(SESS_KEY,{id,at:Date.now()});ls.set(LASTID_KEY,a.lid);logEvent("회원가입",`${rec.name} (${a.lid})`,id);startSess({...rec,id})}
async function setupSubmit(){const L=UI.login,a=readAcct("su");L.loginId=$("#su_id").value;L.name=a.name;const fail=m=>{L.err=m;renderLogin()};
  const e=acctError(a);if(e)return fail(e);
  let r;try{r=await srvPost("/api/setup",{loginId:a.lid,name:a.name,password:a.p1})}catch{r={error:"서버에 연결할 수 없습니다"}}if(r.ok){ls.set(SESS_KEY,{id:r.id,token:r.token});ls.set(LASTID_KEY,a.lid);location.reload();return}fail(r.error||"설정하지 못했습니다")}
async function adminAddStaff(lid,name,pw,role){lid=normId(lid);name=normName(name);
  if(!ID_RE.test(lid)){toast("아이디는 영문·숫자 3~20자입니다");return false}if(!name){toast("이름을 입력하세요");return false}if(!pwOk(pw)){toast("비밀번호는 4자 이상입니다");return false}
  if(SERVER){let r;try{r=await srvPost("/api/staff",{loginId:lid,name,password:pw,role:role||"worker"})}catch{r={error:"서버에 연결할 수 없습니다"}}if(!r.ok){toast(r.error||"추가하지 못했습니다");return false}toast(`${name} (${lid}) 계정을 만들었습니다`);return true}
  if(staffById(lid)){toast("이미 쓰고 있는 아이디입니다");return false}
  const rec={loginId:lid,name,role:role||"worker",addedBy:who()||"",createdAt:new Date().toISOString(),...await pwFields(pw)};
  put("staff/"+uid("w"),rec);logEvent("계정 추가",`${name} (${lid}, ${role==="manager"?"관리자":"현장"})`);toast(`${name} (${lid}) 계정을 만들었습니다`);return true}
async function adminSetPw(id){const i=$("#pw_"+id),pw=i?i.value:"",li=$("#lid_"+id),w0=S.staff[id];const lid=li?normId(li.value):normId(w0&&w0.loginId);
  if(!ID_RE.test(lid)){toast("아이디는 영문·숫자 3~20자입니다");return}if(!pwOk(pw)){toast("비밀번호는 4자 이상입니다");return}
  if(SERVER){let r;try{r=await srvPost("/api/staff/"+id+"/password",{password:pw,loginId:lid})}catch{r={error:"서버에 연결할 수 없습니다"}}toast(r.ok?"비밀번호를 바꿨습니다":(r.error||"바꾸지 못했습니다"));if(r.ok&&i)i.value="";return}
  const other=staffById(lid);if(other&&other.id!==id){toast("이미 쓰고 있는 아이디입니다");return}
  const w=clone(w0);Object.assign(w,{loginId:lid},await pwFields(pw));delete w.id;put("staff/"+id,w);logEvent("비밀번호 재설정",`${w.name} (${lid})`,id);toast(`${w.name} 님의 비밀번호를 바꿨습니다`)}
function lastManagerGuard(id,nextRole){if(!loginOn())return false;const left=managers().filter(w=>w.id!==id||nextRole==="manager");if(!left.length){toast("로그인을 쓰는 동안 관리자는 한 명 이상 있어야 합니다");return true}return false}
function userBox(){const b=$("#userBox"),wl=$("#whoSel")&&$("#whoSel").closest("label");if(!b)return;const on=loginOn(),s=on&&getSess();if(wl)wl.hidden=on;
  const sig=on+"|"+(s?s.id+s.role+s.name:"");if(b.dataset.sig===sig)return;b.dataset.sig=sig;
  b.innerHTML=s?`<span class="userchip" title="${esc(s.loginId)}">${esc(s.name)}${s.role==="manager"?" · 관리자":""}</span><button type="button" class="btn small" data-act="logout">로그아웃</button>`:""}

function rerenderForm(){if(UI.tab==="wash"){$("#washForm").innerHTML=washForm();bindWash()}else if(UI.tab==="heat"){$("#heatForm").innerHTML=heatForm();bindHeat()}else if(UI.tab==="pack"){$("#packForm").innerHTML=packForm();bindPack()}}
function scrollToForm(id){if(innerWidth<860){const el=$(id);el&&el.scrollIntoView({behavior:"smooth",block:"start"})}}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b||b.tagName==="SELECT"||b.type==="checkbox"||b.tagName==="INPUT")return;
  const a=b.dataset.act,id=b.dataset.id,v=b.dataset.v;
  if(a==="goto")setTab(v);
  else if(a==="period"){UI.period=v;refresh()}
  else if(a==="loadSample"){const s=sample();Object.entries(s.products).forEach(([k,p])=>put("products/"+k,p,true));Object.entries(s.lots).forEach(([k,l])=>put("lots/"+k,l,true));Object.entries(s.packs).forEach(([k,p])=>put("packs/"+k,p,true));refresh();toast("10/17~20 일지 예시를 채웠습니다")}

  else if(a==="cancelEdit"){UI.editLot=null;render()}

  else if(a==="noConfirm"){const was=UI.confirm;UI.confirm=null;refresh();if(was==="ungroup")rerenderForm()}
  else if(a==="del"){UI.confirm=null;softDelete(b.dataset.k,id);if(b.dataset.k==="lot"&&UI.editLot===id)UI.editLot=null}

    lots.forEach(l0=>{const l=clone(l0);delete l.wash;delete l.heat;put("lots/"+l.id,l,true)});logEvent("묶음 풀기",`B/L ${lots.map(l=>l.bl).join("+")} 세척 기록 삭제`,lots[0].id);
    UI.washSel=[];UI.washMulti=false;refresh();rerenderForm();toast("묶음을 풀었습니다. 로트별로 다시 세척 중량을 입력하세요")}
  else if(a==="pick"){const k=b.dataset.k;
    if(k==="wash"){const l=S.lots[v];const ids=unitIds(l);
      if(UI.washMulti){const on=ids.every(i=>UI.washSel.includes(i));UI.washSel=on?UI.washSel.filter(i=>!ids.includes(i)):[...new Set([...UI.washSel,...ids])]}
      else{UI.washSel=ids;if(ids.length>1)UI.washMulti=true}UI.confirm=null;refresh();rerenderForm();scrollToForm("#washForm")}
    else if(k==="heat"){UI.heatUnit=v;refresh();rerenderForm();scrollToForm("#heatForm")}
    else{UI.packUnit=v;UI.editPack=null;UI.confirm=null;refresh();rerenderForm();scrollToForm("#packSum")}}
  else if(a==="packMode"){UI.packMode=v;UI.editPack=null;render()}

    if(packIds(p).length){UI.packMode="lot";const l=S.lots[packIds(p)[0]];UI.packUnit=l?unitIds(l).slice().sort().join("+"):UI.packUnit}else UI.packMode="free";
    render();const f=$("#packForm");f&&f.scrollIntoView({behavior:"smooth",block:"start"})}
  else if(a==="addOpt")addOption(id,b.dataset.k);
  else if(a==="cancelOpt"){const bx=$("#"+id+"_add");if(bx)bx.hidden=true}
  else if(a==="cancelPack"){UI.editPack=null;rerenderForm()}
  else if(a==="docType"){UI.docType=v;$$('[data-act="docType"]').forEach(x=>x.setAttribute("aria-pressed",x.dataset.v===v));refresh()}
  else if(a==="dlDoc")dlDoc(v);
  else if(a==="saveProd"){const tr=b.closest("tr"),o={};$$("input",tr).forEach(i=>{const k=i.dataset.k,t=PF.find(f=>f[0]===k)[2];o[k]=t==="n"?num(i.value):t==="c"?i.checked:i.value.trim()});
    if(!o.name){toast("제품명을 입력하세요");return}if(!o.sizeKg){toast("규격(kg)을 숫자로 입력하세요");return}
    const pid=id==="new"?uid("p_"):id;put("products/"+pid,o);logEvent(id==="new"?"제품 추가":"제품 기준 변경",`${o.name} · 세척 ${o.stdWash??"-"}% · 가열 ${o.needsHeat?(o.stdHeat??"미정")+"%":"없음"} · 포장 ${o.stdPack??"-"}%`);toast(id==="new"?"제품을 추가했습니다":"저장했습니다")}

  else if(a==="rmSite"){if(sites().length<=1){toast("사업장은 하나 이상 있어야 합니다");return}if(Object.values(S.lots).some(l=>!l.deleted&&siteOf(l)===v)){toast("이 사업장 기록이 있어 뺄 수 없습니다");return}const c={...S.cfg,sites:sites().filter(x=>x!==v)};delete c.id;put("config/main",c);logEvent("사업장 빼기",v)}
  else if(a==="exportXlsx")exportXlsx();
  else if(a==="aView"){UI.aView=v;refresh()}

    const c={...S.cfg,loginRequired:t.checked};delete c.id;put("config/main",c);logEvent("설정 변경",t.checked?"로그인 켬":"로그인 끔");toast(t.checked?"로그인을 켰습니다. 관리자 아이디로 로그인하세요":"로그인을 껐습니다");return}
  if(t.id==="siteSel"){UI.site=t.value;ls.set(LKEY+"-site",t.value);t.dataset.sig="";UI.washSel=[];UI.heatUnit=null;UI.packUnit=null;UI.docUnit=null;render();toast(t.value?`${t.value} 기록만 보여 줍니다`:"전체 사업장을 보여 줍니다");return}
  if(t.id==="chkFile"){const f=t.files[0];if(f)chkFile(f);t.value="";return}
  if(t.dataset&&t.dataset.act==="chkAll"){UI.chkAll=t.checked;refresh();return}
  const a=t.dataset&&t.dataset.act;if(!a)return;
  if(a==="prodFilter"){UI.prodFilter=t.value;refresh()}
  else if(a==="showDone"){UI.showDone[t.dataset.k]=t.checked;refresh()}
  else if(a==="washMulti"){UI.washMulti=t.checked;if(!t.checked&&UI.washSel.length>1){const l=S.lots[UI.washSel[0]];UI.washSel=l?unitIds(l):[];if(UI.washSel.length>1)UI.washMulti=true}refresh();rerenderForm()}
  else if(a==="packDone"){const ids=keyIds(UI.packUnit);ids.forEach(i=>{const l=clone(S.lots[i]);l.packDone=t.checked;put("lots/"+i,l,true)});refresh();
    logEvent(t.checked?"포장 완료":"포장 완료 취소",`B/L ${ids.map(i=>S.lots[i]?.bl).join("+")}`,ids[0]);toast(t.checked?"포장 완료로 표시했습니다":"포장 중으로 되돌렸습니다")}
  else if(a==="docUnit"){UI.docUnit=t.value;refresh()}
  else if(a==="flowSel"){UI.flowSel=t.value;refresh()}
  else if(a==="rKey"){UI.rKey=t.value;refresh()}
  else if(a==="logDate"){UI.logDate=t.value;refresh()}
});
